<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="application-name" content="TradeLog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TradeLog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #0a1633;
      }

      #root {
        display: flex;
        min-height: 100%;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>برای اجرای TradeLog باید JavaScript مرورگر فعال باشد.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (error) {
            console.warn('TradeLog service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
