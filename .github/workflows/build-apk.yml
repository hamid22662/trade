name: Build TradeLog APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate local debug/release signing keystore
        # android/app/debug.keystore is intentionally gitignored (it's a secret-shaped file),
        # so a fresh checkout - like this CI runner - never has it. A real Android dev machine
        # normally has one auto-generated by Android Studio/SDK tools on first run; here we
        # generate the same standard debug keystore by hand so the build (which signs both
        # debug and release with it, see android/app/build.gradle) has something to sign with.
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release signing keystore
        # Optional: only writes a file if the RELEASE_KEYSTORE_BASE64 repository secret has
        # been set (Settings -> Secrets and variables -> Actions). Without it, the build below
        # falls back to the throwaway debug keystore generated above - fine for personal
        # testing, but store submissions (Bazaar/Myket) need the real, permanent release
        # keystore so every future update keeps the same signature.
        # (GitHub Actions does not allow the `secrets` context inside `if:`, so the emptiness
        # check happens in the shell instead.)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set; the debug keystore will sign this build."
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify local-first app and PWA
        run: npm run check

      - name: Build and verify installable release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: npm run build:android-apk

      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/release/app-release.apk | tee android/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeLog-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
